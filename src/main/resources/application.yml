spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mental_health_assist?useSSL=false&serverTimezone=UTC
    username: root
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: 49.232.209.73
      port: 6379
  ai:
    open-ai:
      chat:
        options:
          model: qwen4-max
        completions-path: /chat/completions
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      emotion:
        model: qwen3.8-flash
      emotionComplete:
        model: qwen3.8-flash
      memoryCompact:
        model: qwen3.8-flash
      embedding:
        options:
          model: BAAI/bge-m3
        api-key: ${SILICONFLOW_API_KEY}
        base-url: https://api.siliconflow.cn
    vectorstore:
      redis:
        uri: redis://49.232.209.73:6379
        initialize-schema: true
#服务器配置
server:
  port: 8080
#JWT配置
jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: 86400000 #1天
  refresh-expiration: 604800000 #7天
  header: Authorization #token头部名称
  token-prefix: "Bearer " #token前缀
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    ConsultationMessageMapper: debug
